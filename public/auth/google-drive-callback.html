<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Drive Authorization Callback — Escrow BMS</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      border: 3px solid #334155;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 { font-size: 1.25rem; margin-bottom: 8px; font-weight: 600; }
    p { color: #94a3b8; font-size: 0.875rem; margin: 0; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="card">
    <div id="icon-container" class="spinner"></div>
    <h2 id="title">Completing Authorization...</h2>
    <p id="message">Please wait while we connect your Google Drive account.</p>
  </div>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');
      const state = urlParams.get('state');

      const titleEl = document.getElementById('title');
      const messageEl = document.getElementById('message');
      const spinnerEl = document.getElementById('icon-container');

      if (error) {
        spinnerEl.style.display = 'none';
        titleEl.textContent = 'Authorization Failed';
        titleEl.classList.add('error');
        messageEl.textContent = 'Error: ' + error;

        if (window.opener) {
          window.opener.postMessage({
            type: 'GOOGLE_DRIVE_AUTH_ERROR',
            error: error
          }, window.location.origin);
        }
        setTimeout(function() { window.close(); }, 3000);
        return;
      }

      if (code) {
        try {
          // Persist authorization code to localStorage for cross-window detection
          localStorage.setItem('google_drive_auth_code', code);
          localStorage.setItem('google_drive_auth_timestamp', Date.now().toString());
          if (state) {
            localStorage.setItem('google_drive_auth_state', state);
          }
        } catch (e) {
          console.error('Storage write error:', e);
        }

        // Send cross-window message if opened as popup
        if (window.opener) {
          window.opener.postMessage({
            type: 'GOOGLE_DRIVE_AUTH_CODE',
            code: code,
            state: state
          }, window.location.origin);
        }

        titleEl.textContent = 'Authorization Successful!';
        messageEl.textContent = 'Connected successfully. Closing window...';

        setTimeout(function() {
          window.close();
        }, 1200);
      } else {
        spinnerEl.style.display = 'none';
        titleEl.textContent = 'No Authorization Code Found';
        messageEl.textContent = 'This page should only be accessed via Google OAuth redirect.';
      }
    })();
  </script>
</body>
</html>
